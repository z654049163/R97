<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R97 论文模型图 - 交互式高清查看器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1E293B;
    color: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  /* 顶部工具栏 */
  .toolbar {
    height: 54px;
    background: #0F172A;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
  }
  .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .title-area h1 {
    font-size: 14.5px;
    font-weight: 700;
    color: #F8FAFC;
  }
  .badge {
    font-size: 11px;
    background: #0072B2;
    color: #FFF;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  button {
    background: #334155;
    color: #F1F5F9;
    border: 1px solid #475569;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover {
    background: #475569;
    color: #FFF;
  }
  button.active {
    background: #0072B2;
    border-color: #56B4E9;
    color: #FFF;
  }
  button.nature-active {
    background: #059669;
    border-color: #34D399;
    color: #FFF;
  }
  button.afg-active {
    background: #0072B2;
    border-color: #56B4E9;
    color: #FFF;
  }
  button.ai-active {
    background: #7C3AED;
    border-color: #A78BFA;
    color: #FFF;
  }
  .divider {
    width: 1px;
    height: 18px;
    background: #475569;
    margin: 0 3px;
  }
  .zoom-indicator {
    font-family: monospace;
    font-size: 12.5px;
    color: #94A3B8;
    min-width: 48px;
    text-align: center;
  }
  /* 画布展示区 */
  .viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle, #334155 10%, transparent 11%);
    background-size: 20px 20px;
    background-color: #1E293B;
    cursor: grab;
  }
  .viewport:active {
    cursor: grabbing;
  }
  .container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    background: #FFF;
    border-radius: 4px;
    overflow: hidden;
  }
  img {
    display: block;
    max-width: none;
    pointer-events: none;
  }
  .hint-bar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(255,255,255,0.12);
    color: #94A3B8;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 11.5px;
    pointer-events: none;
    backdrop-filter: blur(4px);
    display: flex;
    gap: 16px;
  }
  .hint-bar span {
    color: #38BDF8;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="title-area">
      <h1>R97 系统架构模型图</h1>
      <span class="badge" id="badgeTag">Okabe-Ito 学术标准色系</span>
    </div>
    <div class="controls">
      <!-- 风格切换 -->
      <span style="font-size:11.5px; color:#94A3B8; margin-right:2px;">版本对比:</span>
      <button onclick="setVersion('afg')" id="btnVerAfg" class="afg-active">🎨 Academic Figure 版 (Okabe-Ito 色系)</button>
      <button onclick="setVersion('nature')" id="btnVerNature">🌿 Nature 旗舰版</button>
      <button onclick="setVersion('academic')" id="btnVerAcademic">🏛️ USENIX/IEEE 顶会版</button>
      <button onclick="setVersion('ai')" id="btnVerAi">🤖 GPT Image 2 (对比)</button>
      <div class="divider"></div>

      <!-- 格式切换 -->
      <button onclick="setFormat('svg')" id="btnFmtSvg" class="active">矢量 SVG</button>
      <button onclick="setFormat('png')" id="btnFmtPng">超清 PNG</button>
      <div class="divider"></div>

      <!-- 缩放控制 -->
      <button onclick="zoomOut()">缩小 (-)</button>
      <span class="zoom-indicator" id="zoomText">100%</span>
      <button onclick="zoomIn()">放大 (+)</button>
      <button onclick="resetZoom(1.0)">1:1 实际尺寸</button>
      <button onclick="fitWindow()">适应屏幕</button>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div class="container" id="container">
      <img id="diagramImg" src="r97_academic_figure_generator_model.svg" alt="R97 Architecture" width="1440" height="760">
    </div>
    <div class="hint-bar">
      <div>🖱️ <span>滚轮缩放</span> (15% ~ 600%)</div>
      <div>✋ <span>鼠标左键拖拽</span> 平移画布</div>
      <div>🎯 <span>双击</span> 复位适屏</div>
    </div>
  </div>

<script>
  let currentVersion = 'afg'; // 'afg', 'nature', 'academic', or 'ai'
  let currentFormat = 'svg';   // 'svg' or 'png'
  let scale = 1.0;
  let posX = 0;
  let posY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  const container = document.getElementById('container');
  const viewport = document.getElementById('viewport');
  const zoomText = document.getElementById('zoomText');
  const img = document.getElementById('diagramImg');
  const badgeTag = document.getElementById('badgeTag');

  const btnVerAfg = document.getElementById('btnVerAfg');
  const btnVerNature = document.getElementById('btnVerNature');
  const btnVerAcademic = document.getElementById('btnVerAcademic');
  const btnVerAi = document.getElementById('btnVerAi');
  const btnFmtSvg = document.getElementById('btnFmtSvg');
  const btnFmtPng = document.getElementById('btnFmtPng');

  function updateImageSrc() {
    if (currentVersion === 'ai') {
      img.src = 'gpt_image2_result.png';
      img.width = 1672;
      img.height = 940;
      badgeTag.textContent = 'GPT Image 2 AI 生成图 (存在字迹幻觉)';
      badgeTag.style.background = '#7C3AED';
      btnFmtSvg.style.display = 'none';
      btnFmtPng.style.display = 'none';
      return;
    }

    btnFmtSvg.style.display = 'inline-block';
    btnFmtPng.style.display = 'inline-block';

    let filename = '';
    if (currentVersion === 'afg') {
      filename = `r97_academic_figure_generator_model.${currentFormat}`;
      img.width = 1440;
      img.height = 760;
      badgeTag.textContent = 'Academic Figure Generator 重绘版 (Okabe-Ito 学术标准色系)';
      badgeTag.style.background = '#0072B2';
    } else if (currentVersion === 'nature') {
      filename = `r97_nature_model_architecture.${currentFormat}`;
      img.width = 1440;
      img.height = 760;
      badgeTag.textContent = 'Nature 旗舰版 (多面板机制图规范)';
      badgeTag.style.background = '#059669';
    } else {
      filename = `r97_system_architecture_academic.${currentFormat}`;
      img.width = 1440;
      img.height = 720;
      badgeTag.textContent = 'USENIX/IEEE 顶会版 (Stage I-V 管道架构)';
      badgeTag.style.background = '#0284C7';
    }
    img.src = filename;
  }

  function setVersion(ver) {
    currentVersion = ver;
    btnVerAfg.className = '';
    btnVerNature.className = '';
    btnVerAcademic.className = '';
    btnVerAi.className = '';

    if (ver === 'afg') {
      btnVerAfg.className = 'afg-active';
    } else if (ver === 'nature') {
      btnVerNature.className = 'nature-active';
    } else if (ver === 'academic') {
      btnVerAcademic.className = 'active';
    } else {
      btnVerAi.className = 'ai-active';
    }
    updateImageSrc();
    fitWindow();
  }

  function setFormat(fmt) {
    currentFormat = fmt;
    if (fmt === 'svg') {
      btnFmtSvg.className = 'active';
      btnFmtPng.className = '';
    } else {
      btnFmtPng.className = 'active';
      btnFmtSvg.className = '';
    }
    updateImageSrc();
  }

  function updateTransform() {
    container.style.transform = `translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px)) scale(${scale})`;
    zoomText.textContent = `${Math.round(scale * 100)}%`;
  }

  function zoomIn() {
    scale = Math.min(scale * 1.25, 6.0);
    updateTransform();
  }

  function zoomOut() {
    scale = Math.max(scale / 1.25, 0.2);
    updateTransform();
  }

  function resetZoom(targetScale = 1.0) {
    scale = targetScale;
    posX = 0;
    posY = 0;
    updateTransform();
  }

  function fitWindow() {
    const vw = viewport.clientWidth - 80;
    const vh = viewport.clientHeight - 80;
    let iw = 1440, ih = 760;
    if (currentVersion === 'academic') { iw = 1440; ih = 720; }
    if (currentVersion === 'ai') { iw = 1672; ih = 940; }
    scale = Math.min(vw / iw, vh / ih);
    posX = 0;
    posY = 0;
    updateTransform();
  }

  // 鼠标拖拽平移
  viewport.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    updateTransform();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // 滚轮缩放
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 0.85;
    scale = Math.max(0.15, Math.min(6.0, scale * factor));
    updateTransform();
  }, { passive: false });

  // 双击复位
  viewport.addEventListener('dblclick', fitWindow);

  window.addEventListener('load', fitWindow);
  window.addEventListener('resize', fitWindow);
</script>
</body>
</html>
